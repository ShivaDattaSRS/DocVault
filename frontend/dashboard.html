<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocVault — My files</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="row" style="gap:9px">
      <div class="brand-mark" style="width:30px;height:30px;font-size:13px;border-radius:9px">DV</div>
      <strong>DocVault</strong>
    </div>
    <div class="grow"></div>
    <a href="/admin" class="btn secondary small hidden" id="admin-link">Admin</a>
    <div class="row" style="gap:8px">
      <div class="avatar" id="avatar">?</div>
      <div style="line-height:1.25">
        <div class="small" style="font-weight:600" id="user-name">—</div>
        <div class="small muted" id="user-email">—</div>
      </div>
    </div>
    <button class="ghost small" id="logout">Sign out</button>
  </header>

  <div class="layout">
    <!-- ------------------------------------------------------- sidebar -->
    <aside class="sidebar">
      <div class="card" style="padding:16px">
        <div class="row spread">
          <h3>Storage</h3>
          <span class="small muted" id="quota-pct">0%</span>
        </div>
        <div class="meter mt-16" id="quota-meter"><span style="width:0%"></span></div>
        <p class="small muted" style="margin:8px 0 0" id="quota-text">— of —</p>
        <p class="small muted" style="margin:2px 0 0" id="file-count">0 files</p>
      </div>

      <div class="card" style="padding:12px">
        <div class="row spread" style="padding:0 4px 8px">
          <h3>Folders</h3>
          <button class="ghost small" id="new-folder" title="New folder">+ New</button>
        </div>
        <div id="folder-list"></div>
      </div>

      <div class="card" style="padding:16px">
        <h3>Filter by type</h3>
        <div class="chips mt-16" id="kind-chips">
          <span class="chip active" data-kind="">All</span>
          <span class="chip" data-kind="pdf">PDF</span>
          <span class="chip" data-kind="image">Images</span>
          <span class="chip" data-kind="csv">CSV</span>
          <span class="chip" data-kind="docx">DOCX</span>
        </div>
      </div>
    </aside>

    <!-- ---------------------------------------------------------- main -->
    <main style="display:grid;gap:18px;min-width:0">
      <section class="card">
        <div class="row spread" style="margin-bottom:14px">
          <h2 id="upload-target">Upload to My files</h2>
          <label class="row small muted" style="margin:0;gap:6px;cursor:pointer">
            <input type="checkbox" id="upload-public" style="width:auto">
            Make uploads public
          </label>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="icon">⬆️</div>
          <p style="margin:8px 0 4px"><strong>Drop files here</strong> or click to browse</p>
          <p class="small muted" style="margin:0" id="accept-hint">PDF, PNG, JPG, GIF, WebP, BMP, CSV, DOCX</p>
          <input type="file" id="file-input" multiple class="hidden">
        </div>

        <div id="upload-queue" class="mt-16"></div>
      </section>

      <section>
        <div class="row spread wrap" style="margin-bottom:14px;gap:10px">
          <h2 id="view-title">My files</h2>
          <div class="row wrap" style="gap:8px">
            <input type="search" id="search" placeholder="Search files…" style="width:200px">
            <select id="sort" style="width:auto">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="name">Name A–Z</option>
              <option value="largest">Largest first</option>
              <option value="size">Smallest first</option>
            </select>
            <button class="secondary small" id="refresh">Refresh</button>
          </div>
        </div>

        <div id="file-area"><div class="empty"><span class="spinner"></span></div></div>
        <div class="row center mt-16" style="justify-content:center;gap:10px" id="pager"></div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
